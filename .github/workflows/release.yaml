name: Release Workflow

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_READ_WRITE_DELETE_ACCESS_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/youl-tcg-showcase:${{ github.ref_name }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/youl-tcg-showcase:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/youl-tcg-showcase:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/youl-tcg-showcase:buildcache,mode=max
